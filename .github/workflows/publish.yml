name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: npm-publish

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm test

      - name: Check whether the version is published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          VERSIONS=$(npm view "$NAME" versions --json)
          PUBLISHED=$(node -p '[JSON.parse(process.argv[1])].flat().includes(process.argv[2])' "$VERSIONS" "$VERSION")
          if [ "$PUBLISHED" = false ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.version != ''
        run: npm publish --access public

      - name: Create GitHub release
        if: steps.check.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes
